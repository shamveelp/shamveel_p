<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag to automatically redirect to the PDF -->
    <meta http-equiv="refresh" content="0; url=../Resume.pdf">
    <title>Redirecting to Resume...</title>
</head>
<body>
    <p>If you are not redirected automatically, please <a href="../Resume.pdf">click here to view the resume</a>.</p>
    <script>
        // JavaScript fallback redirect just in case meta refresh is disabled
        window.location.replace("../Resume.pdf");
    </script>
</body>
</html>
